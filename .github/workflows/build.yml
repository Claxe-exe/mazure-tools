name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check TR/EN dictionaries
        shell: pwsh
        run: ./tools/Test-Localization.ps1

      - name: Build
        run: dotnet build MazureTools.csproj -c Release --nologo
