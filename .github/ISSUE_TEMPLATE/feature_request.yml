name: Feature request
description: Suggest a tool or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: It changes system state, so it should show what will happen and ask before doing it.
